<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Carrusel de Imágenes Elegante</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Arial', sans-serif;
            background-color: #f0f0f0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .carousel-container {
            width: 100%;
            max-width: 1000px;
            position: relative;
            overflow: hidden;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.15);
        }

        .carousel {
            display: flex;
            transition: transform 0.5s ease-in-out;
            height: 500px;
        }

        .slide {
            min-width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
        }

        .slide img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .carousel-controls {
            position: absolute;
            top: 50%;
            width: 100%;
            display: flex;
            justify-content: space-between;
            padding: 0 20px;
            transform: translateY(-50%);
        }

        .control-btn {
            background-color: rgba(255, 255, 255, 0.7);
            color: #333;
            border: none;
            width: 50px;
            height: 50px;
            border-radius: 50%;
            font-size: 20px;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
            transition: all 0.3s ease;
        }

        .control-btn:hover {
            background-color: rgba(255, 255, 255, 0.9);
            transform: scale(1.1);
        }

        .carousel-indicators {
            position: absolute;
            bottom: 20px;
            width: 100%;
            display: flex;
            justify-content: center;
            gap: 10px;
        }

        .indicator {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background-color: rgba(255, 255, 255, 0.5);
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .indicator.active {
            background-color: white;
            transform: scale(1.2);
        }

        /* Responsive Styles */
        @media (max-width: 768px) {
            .carousel-container {
                border-radius: 8px;
            }

            .carousel {
                height: 350px;
            }

            .control-btn {
                width: 40px;
                height: 40px;
                font-size: 16px;
            }
        }

        @media (max-width: 480px) {
            .carousel-container {
                border-radius: 6px;
            }

            .carousel {
                height: 250px;
            }

            .control-btn {
                width: 35px;
                height: 35px;
                font-size: 14px;
            }

            .indicator {
                width: 8px;
                height: 8px;
            }
        }
    </style>
</head>
<body>
    <div class="carousel-container">
        <div class="carousel">
            <div class="slide">
                <img src="images/image1.jpg" alt="Imagen 1">
            </div>
            <div class="slide">
                <img src="images/image2.jpg" alt="Imagen 2">
            </div>
            <div class="slide">
                <img src="images/image3.jpg" alt="Imagen 3">
            </div>
            <div class="slide">
                <img src="images/image4.jpg" alt="Imagen 4">
            </div>
            <div class="slide">
                <img src="images/image5.jpg" alt="Imagen 5">
            </div>
            <div class="slide">
                <img src="images/image6.jpg" alt="Imagen 6">
            </div>
            <div class="slide">
                <img src="images/image7.JPG" alt="Imagen 7">
            </div>
        </div>
        
        <div class="carousel-controls">
            <button class="control-btn prev">&#10094;</button>
            <button class="control-btn next">&#10095;</button>
        </div>
        
        <div class="carousel-indicators"></div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const carousel = document.querySelector('.carousel');
            const slides = document.querySelectorAll('.slide');
            const prevBtn = document.querySelector('.prev');
            const nextBtn = document.querySelector('.next');
            const indicatorsContainer = document.querySelector('.carousel-indicators');
            
            let currentIndex = 0;
            let slideWidth = carousel.clientWidth;
            let autoplayTimer;
            const autoplayDelay = 3000; // 5 segundos
            
            // Función para actualizar el ancho de los slides al cambiar el tamaño de la ventana
            function updateDimensions() {
                slideWidth = carousel.clientWidth;
                goToSlide(currentIndex);
            }
            
            // Crear indicadores
            slides.forEach((_, index) => {
                const indicator = document.createElement('div');
                indicator.classList.add('indicator');
                if (index === 0) indicator.classList.add('active');
                indicator.addEventListener('click', () => goToSlide(index));
                indicatorsContainer.appendChild(indicator);
            });
            
            // Función para ir a un slide específico
            function goToSlide(index) {
                if (index < 0) index = slides.length - 1;
                if (index >= slides.length) index = 0;
                
                currentIndex = index;
                carousel.style.transform = `translateX(${-slideWidth * currentIndex}px)`;
                
                // Actualizar indicadores
                document.querySelectorAll('.indicator').forEach((ind, i) => {
                    ind.classList.toggle('active', i === currentIndex);
                });
                
                // Reiniciar el autoplay
                resetAutoplay();
            }
            
            // Función para el autoplay
            function startAutoplay() {
                autoplayTimer = setInterval(() => {
                    goToSlide(currentIndex + 1);
                }, autoplayDelay);
            }
            
            function resetAutoplay() {
                clearInterval(autoplayTimer);
                startAutoplay();
            }
            
            // Event listeners
            prevBtn.addEventListener('click', () => goToSlide(currentIndex - 1));
            nextBtn.addEventListener('click', () => goToSlide(currentIndex + 1));
            
            window.addEventListener('resize', updateDimensions);
            
            // Touch events para soporte móvil
            let touchStartX = 0;
            let touchEndX = 0;
            
            carousel.addEventListener('touchstart', e => {
                touchStartX = e.changedTouches[0].screenX;
            }, { passive: true });
            
            carousel.addEventListener('touchend', e => {
                touchEndX = e.changedTouches[0].screenX;
                handleSwipe();
            }, { passive: true });
            
            function handleSwipe() {
                const diff = touchStartX - touchEndX;
                if (Math.abs(diff) > 50) { // Umbral mínimo para considerar un swipe
                    if (diff > 0) {
                        // Swipe a la izquierda
                        goToSlide(currentIndex + 1);
                    } else {
                        // Swipe a la derecha
                        goToSlide(currentIndex - 1);
                    }
                }
            }
            
            // Inicializar
            updateDimensions();
            startAutoplay();
        });
    </script>
</body>
</html>
